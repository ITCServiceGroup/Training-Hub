name: Validate and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated artifact to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting boundary
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check service contracts
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Validate migration and authorization-test contracts
        run: npm run db:static

      - name: Start local Supabase database
        run: >-
          npx supabase start
          --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Lint the replayed database
        run: npm run db:lint

      - name: Run database authorization and integrity tests
        run: npm run db:test

      - name: Parse Edge Function entrypoints
        run: npm run functions:check

      - name: Enforce authored-source budgets
        run: npm run source:check

      - name: Validate build configuration
        run: npm run validate:env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Reject production source maps
        run: test -z "$(find dist -type f -name '*.map' -print -quit)"

      - name: Enforce route bundle budgets
        run: npm run bundle:check

      - name: Reject production diagnostics and sensitive debug labels
        run: npm run diagnostics:check

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility smoke tests
        run: npm run test:e2e

      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
