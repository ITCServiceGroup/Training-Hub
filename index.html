<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Training Hub</title>
    <meta name="description" content="Training and certification platform" />
    <!-- Extension compatibility meta tags -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      base-uri 'self';
      object-src 'none';
      form-action 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: blob: https:;
      font-src 'self' data: https://fonts.gstatic.com;
      connect-src 'self' data: blob: https://*.supabase.co https://fonts.gstatic.com;
      frame-src 'self' https://*.supabase.co https://www.youtube.com https://youtube.com https://player.vimeo.com;
      media-src 'self' data: blob: https://*.supabase.co;
      worker-src 'self' blob:;
    "
    />
    <!-- Permissions Policy for YouTube embeds -->
    <meta
      http-equiv="Permissions-Policy"
      content='
      compute-pressure=(),
      accelerometer=(),
      gyroscope=(),
      magnetometer=(),
      microphone=(),
      camera=(),
      geolocation=(),
      payment=(),
      usb=(),
      fullscreen=(self "https://www.youtube.com" "https://player.vimeo.com"),
      autoplay=(self "https://www.youtube.com" "https://player.vimeo.com")
    '
    />
    <script src="./theme-preload.js" vite-ignore></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Removed GrapesJS local JS scripts -->
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
